# Registro fonti di DTH (schema: backend/src/dth/core/sources.py).
# L'utente può aggiungere, disattivare e riordinare le fonti dalla tab "Fonti".
# Costi, limiti e termini d'uso cambiano: verificarli prima di attivare ogni fonte.
#
# kind:        data | news | portal | llm
# access:      api | csv | rss | web | manual
# cost:        free | freemium | paid | account
# auth:        none | key | oauth | account
# reliability: A (ufficiale/primaria) | B (affidabile, secondaria) | C (non ufficiale, da incrociare)
# status:      active | planned | disabled
# categories:  prices, macro, rates, volatility, positioning, sentiment, events, news,
#              real_estate, etf, indices, crypto, commodities, startups, ipo, filings, portfolio, llm
version: 1
sources:
  # ── Prezzi e mercati ────────────────────────────────────────────────────────
  - id: yfinance
    name: Yahoo Finance (yfinance)
    kind: data
    categories: [prices, etf, indices, commodities, crypto]
    url: https://finance.yahoo.com
    access: api
    cost: free
    auth: none
    reliability: C
    status: active
    notes: Non ufficiale, può rompersi. Sempre incrociata con una seconda fonte.
  - id: stooq
    name: Stooq
    kind: data
    categories: [prices, indices, etf]
    url: https://stooq.com
    access: csv
    cost: free
    auth: none
    reliability: B
    status: planned
  - id: eodhd
    name: EOD Historical Data
    kind: data
    categories: [prices, etf, indices]
    url: https://eodhd.com
    access: api
    cost: paid
    auth: key
    reliability: B
    status: planned
    notes: Candidata per gli ETF UCITS su Borsa Italiana e Xetra.
  - id: borsa_italiana
    name: Borsa Italiana / Euronext Milan
    kind: data
    categories: [prices, etf, ipo, events]
    url: https://www.borsaitaliana.it
    access: web
    cost: free
    auth: none
    reliability: A
    status: planned
    notes: Calendari, nuove quotazioni, dati ETFplus. Verificare i termini d'uso prima dell'automazione.

  - id: financedatabase
    name: FinanceDatabase (JerBouma, MIT)
    kind: data
    categories: [etf, indices, crypto]
    url: https://github.com/JerBouma/FinanceDatabase
    access: api
    cost: free
    auth: none
    reliability: B
    status: active
    notes: Anagrafica di 300.000+ strumenti (ISIN, borsa, categoria), senza prezzi. Usata per proporre nuovi prodotti al catalogo.
  - id: justetf
    name: justETF (via justetf-scraping)
    kind: data
    categories: [etf]
    url: https://www.justetf.com
    access: web
    cost: free
    auth: none
    reliability: B
    status: planned
    notes: TER e dimensione degli ETF UCITS, solo come proposta di aggiornamento del catalogo da rivedere a mano.
    warning: "Dati raccolti dal sito, verificare i termini d'uso di justETF prima di un uso regolare."

