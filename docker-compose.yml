# Deploy sul NUC. L'API resta su LAN/Tailscale: non pubblicarla su internet.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # cambiare in <ip-lan>:8000 o usare Tailscale
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped

