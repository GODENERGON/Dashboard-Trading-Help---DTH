name: research

# Runs research studies that need internet data (Yahoo Finance) and uploads the report.
# Manual trigger only: Actions → research → Run workflow.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date to download (YYYY-MM-DD)"
        default: "2004-01-01"
        required: false

permissions:
  contents: write  # to publish results on the `research-results` branch

jobs:
  ucits-trend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[data,portfolio]"
      - name: Run study
        env:
          START: ${{ inputs.start }}
        run: python -m dth.cli ucits-trend --start "$START" --out reports/ucits_trend
      - name: Run core-satellite + regime study (pre-registered)
        run: >-
          python -m dth.cli core-satellite
          --prices-csv reports/ucits_trend/prices_eur.csv --out reports/core_satellite
      - name: Run skfolio allocation study (pre-registered)
        run: >-
          python -m dth.cli allocation-study
          --prices-csv reports/ucits_trend/prices_eur.csv --out reports/allocation
      - name: Show reports
        run: |
          cat reports/ucits_trend/report.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/core_satellite/report.md >> "$GITHUB_STEP_SUMMARY"
          cat reports/allocation/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish results on branch research-results
        run: |
          cp -r reports /tmp/reports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan research-results
          git rm -rq --cached . && git clean -fdq -e reports
          rm -rf reports && cp -r /tmp/reports reports
          git add reports
          git commit -qm "research: ucits-trend results (run ${{ github.run_id }})"
          git push -f origin research-results
      - uses: actions/upload-artifact@v4
        with:
          name: ucits-trend-report
          path: reports/ucits_trend/
          retention-days: 30
