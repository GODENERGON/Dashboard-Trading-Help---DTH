name: windows-release

# Builds the Windows installer (Tauri shell + packaged Python engine).
# Publishes a pre-release when a tag v* is pushed or when the `release` branch is updated
# (then the tag is v<version in tauri.conf.json>). Run manually to just build.
on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── 1. Python engine → one-folder executable ─────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install engine
        run: pip install "./backend[desktop]"
      - name: Package engine (PyInstaller)
        run: pyinstaller backend/packaging/dabitur-backend.spec --noconfirm
      - name: Smoke test packaged engine
        shell: pwsh
        run: |
          $env:DTH_DATA_DIR = "$env:RUNNER_TEMP\dabitur-data"
          $env:DTH_AUTO_REFRESH = "false"
          $p = Start-Process -FilePath dist\dabitur-backend\dabitur-backend.exe `
                 -ArgumentList "--port","8799","--token","ci" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod http://127.0.0.1:8799/health | Out-Null; $ok = $true } catch {}
          }
          if (-not $ok) { Get-Content "$env:DTH_DATA_DIR\dabitur-backend.log" -ErrorAction SilentlyContinue; throw "engine did not start" }
          $h = @{ "X-Dabitur-Token" = "ci" }
          $o = Invoke-RestMethod http://127.0.0.1:8799/overview -Headers $h
          Write-Host "overview as_of=$($o.as_of) regime=$($o.current)"
          Invoke-RestMethod http://127.0.0.1:8799/products -Headers $h | Out-Null
          try { Invoke-RestMethod http://127.0.0.1:8799/status; throw "token not enforced" } catch {
            if ($_.Exception.Message -eq "token not enforced") { throw }
          }
          Stop-Process -Id $p.Id -Force
      - name: Hand the engine to the Tauri bundle
        shell: pwsh
        run: Copy-Item -Recurse -Force dist\dabitur-backend\* frontend\src-tauri\engine\

      # ── 2. Desktop shell + installer ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Build installer
        working-directory: frontend
        env:
          # Optional: address that receives tester feedback. Set it as a repository secret;
          # it is compiled into the app, never committed.
          VITE_FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
        run: npx tauri build

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $exe = Get-ChildItem frontend\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          $version = (Get-Content frontend\src-tauri\tauri.conf.json | ConvertFrom-Json).version
          $name = "Dabitur-Setup-$version.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out\$name"
          $size = [math]::Round((Get-Item "out\$name").Length / 1MB, 1)
          Write-Host "installer $name ($size MB)"
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: dabitur-windows
          path: out/*.exe
          retention-days: 30

      - name: Publish pre-release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v${{ steps.collect.outputs.version }}" }
          $file = "out\${{ steps.collect.outputs.name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $file --clobber
          } else {
            gh release create $tag $file --target "${{ github.sha }}" --prerelease `
              --title "Dabitur $tag (versione di prova)" --notes-file docs/RELEASE_NOTES.md
          }
