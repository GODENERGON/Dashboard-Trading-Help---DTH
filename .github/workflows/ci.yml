name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Lint
        run: |
          ruff check backend
          ruff format --check backend
      - name: Test (incl. anti-lookahead harness)
        working-directory: backend
        run: pytest
      - name: Walk-forward smoke test
        run: python -m dth.cli backtest-demo
