[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dth"
version = "0.0.1"
description = "Dashboard Trading Help — backend (data, signals, validation, risk, API)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
scheduler = ["apscheduler>=3.10,<4"]
tsfm = ["timesfm>=1.3", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dth = "dth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY"]
